name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
    branches:
      - main
jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      # Checkout comes first: pnpm/action-setup reads the `packageManager` field out of
      # package.json, so package.json has to be on disk before it runs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      # No `version:` — CI and a developer's machine then run the same pnpm.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Verify published types
        run: pnpm verify:types
      - name: Run tests
        run: pnpm test
      - name: Run linter
        run: pnpm lint
